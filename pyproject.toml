[project]
name = "smilex-ai-memory"
version = "0.1.0"
description = "SmileX Agent Memory System — 嵌入式 AI Agent 记忆系统"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Layer 0: 数据模型
    "python-ulid>=3.0",
    "msgpack>=1.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # Layer 1: 存储引擎
    "aiosqlite>=0.20",
    "sqlite-vec>=0.1.6",
    # Layer 2: 生命周期
    "cachebox>=0.7",
    "tiktoken>=0.8",
    "numpy>=2.1",
    "networkx>=3.4",
    # 通用
    "PyYAML>=6.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smilex"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
