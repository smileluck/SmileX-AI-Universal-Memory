[project]
name = "smilex-ai-memory"
version = "0.1.2"
description = "SmileX Agent Memory System — 嵌入式 AI Agent 记忆系统"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "SmileX" },
]
keywords = ["agent", "memory", "embedding", "sqlite", "vector-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # Layer 0: 数据模型
    "python-ulid>=3.0",
    "msgpack>=1.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # Layer 1: 存储引擎
    "aiosqlite>=0.20",
    "sqlite-vec>=0.1.6",
    # Layer 2: 生命周期
    "cachebox>=0.7",
    "tiktoken>=0.8",
    "numpy>=2.1",
    "networkx>=3.4",
    # 通用
    "PyYAML>=6.0",
    "structlog>=24.4",
]

[project.urls]
Homepage = "https://github.com/smileluck/SmileX-AI-Universal-Memory"
Repository = "https://github.com/smileluck/SmileX-AI-Universal-Memory"

[project.optional-dependencies]
# 决策 D5: 语义 embedding 可选后端(BGE-M3);默认 HashEmbedder 零依赖
embedding = [
    "sentence-transformers>=3.0",
]
# 检索精排可选后端(bge-reranker-v2-m3);默认 NoopReranker 零依赖
rerank = [
    "sentence-transformers>=3.0",
]
# 写入时 LLM 事实抽取可选后端(OpenAI 兼容 API);默认 PassThroughExtractor 零依赖
llm = [
    "openai>=1.50",
]
# 服务化: MCP server + Web 面板(纯嵌入式库不需要)
server = [
    "mcp>=1.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]
# 记忆质量评测(benchmarks/longmemeval): 数据集下载 + LLM 问答/判卷
benchmark = [
    "datasets>=2.20",
    "openai>=1.50",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.28",
]

[project.scripts]
smilex-memory = "smilex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smilex"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# benchmark 判卷/抽取 prompt 的长文本行,重排无意义
"benchmarks/mem0_compat/mem0_prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
